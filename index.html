<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경찰 기동대 스마트 근무표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        .capture-wrapper { position: absolute; left: -9999px; top: -9999px; }
        input::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useMemo } = React;

        const App = () => {
            const [dateStr, setDateStr] = useState("2026-11-18");
            const [unitInfo, setUnitInfo] = useState("22기동단 광1제대 / 노원(370)관내 민생치안");
            
            const [totalCount, setTotalCount] = useState("21");
            const [activeCount, setActiveCount] = useState("16");
            
            const [eventNotes, setEventNotes] = useState("노원(370)관내 민생치안");
            const [personnelNotes, setPersonnelNotes] = useState("순경 심규성 09:00-13:30 (육아/지각)");
            
            const [leaders, setLeaders] = useState("최영규, 윤현수");
            const [isLeaderIncluded, setIsLeaderIncluded] = useState(true);

            const [team1, setTeam1] = useState(`서동준\n안창성\n윤현수\n이동수\n심규성\n최영규`);
            const [team2, setTeam2] = useState(`유제민\n이준호\n안대철\n최장원`);
            const [team3, setTeam3] = useState(`김희수\n이주원\n박종석\n고창희`);
            const [team4, setTeam4] = useState(`김민구\n박인태\n성준영\n황백규\n정진원\n김성현:항해사`);
            
            const [teamActive, setTeamActive] = useState(["4명", "4명", "4명", "4명"]);
            const [excludedNames, setExcludedNames] = useState([]);
            
            const toggleExclude = (name) => {
                setExcludedNames(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
            };
            
            const [locations, setLocations] = useState([
                { text: "유동1", color: "" }, 
                { text: "유동2", color: "" }, 
                { text: "유동3", color: "" }, 
                { text: "유동4", color: "" }
            ]);
            
            const defaultTimes = ["14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];
            
            const [schedule, setSchedule] = useState(defaultTimes.map((t, idx) => ({
                time: t,
                timeColor: idx === 0 ? "bg-yellow-100" : "",
                cells: idx === 0 ? ["성준영", "황백규", "서동준", "안창성"] :
                       idx === 1 ? ["심규성", "유제민", "이준호", "안대철"] :
                       idx === 2 ? ["최장원", "김희수", "이주원", "박종석"] :
                       idx === 3 ? ["고창희", "김민구", "박인태", "성준영"] :
                       idx === 4 ? ["황백규", "서동준", "안창성", "심규성"] :
                       idx === 5 ? ["유제민", "이준호", "안대철", "최장원"] :
                       ["김희수", "이주원", "박종석", "고창희"]
            })));

            const captureRef = useRef(null);

            const handleSaveImage = () => {
                const container = captureRef.current;
                html2canvas(container, { scale: 2.5, backgroundColor: '#ffffff' }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `기동대_근무표_${dateStr}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            };

            const addLocation = () => {
                setLocations([...locations, { text: "새 근무지", color: "" }]);
                setSchedule(schedule.map(row => ({ ...row, cells: [...row.cells, ""] })));
            };

            const removeLocation = (index) => {
                setLocations(locations.filter((_, i) => i !== index));
                setSchedule(schedule.map(row => ({ ...row, cells: row.cells.filter((_, i) => i !== index) })));
            };

            const updateLocation = (index, value) => {
                const newLocs = [...locations];
                newLocs[index].text = value;
                setLocations(newLocs);
            };

            const toggleLocationColor = (index) => {
                const newLocs = [...locations];
                const curr = newLocs[index].color;
                newLocs[index].color = curr === "" ? "bg-yellow-200" : (curr === "bg-yellow-200" ? "bg-green-300" : "");
                setLocations(newLocs);
            };

            const updateTime = (index, value) => {
                const newSchedule = [...schedule];
                newSchedule[index].time = value;
                setSchedule(newSchedule);
            };

            const toggleTimeColor = (index) => {
                const newSched = [...schedule];
                const curr = newSched[index].timeColor;
                newSched[index].timeColor = curr === "" ? "bg-yellow-200" : (curr === "bg-yellow-200" ? "bg-green-300" : "");
                setSchedule(newSched);
            };

            const updateCell = (rIndex, cIndex, value) => {
                const newSchedule = [...schedule];
                newSchedule[rIndex].cells[cIndex] = value;
                setSchedule(newSchedule);
            };

            const addRow = () => {
                setSchedule([...schedule, { time: "00:00", timeColor: "", cells: Array(locations.length).fill("") }]);
            };
            
            const removeRow = (index) => {
                setSchedule(schedule.filter((_, i) => i !== index));
            };

            const updateTeamActive = (index, value) => {
                const newActive = [...teamActive];
                newActive[index] = value;
                setTeamActive(newActive);
            };

            const workCounts = useMemo(() => {
                const counts = {};
                schedule.forEach(row => {
                    row.cells.forEach(cell => {
                        const name = cell.trim();
                        if (name && name !== "-") {
                            counts[name] = (counts[name] || 0) + 1;
                        }
                    });
                });
                return counts;
            }, [schedule]);

            const leaderArray = leaders.split(',').map(s => s.trim()).filter(Boolean);
            
            const parseTeamMembers = (teamStr) => {
                return teamStr.split('\n').map(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return null;
                    let name = trimmed;
                    let display = null;
                    if (trimmed.includes(':')) {
                        const parts = trimmed.split(':');
                        name = parts[0].trim();
                        display = parts[1].trim();
                    }
                    const isLeader = leaderArray.includes(name);
                    const isExcluded = excludedNames.includes(name) || (isLeader && !isLeaderIncluded);
                    return { name, display: display !== null ? display : (workCounts[name] || 0), isExcluded, isLeader };
                }).filter(Boolean);
            };

            const t1 = parseTeamMembers(team1);
            const t2 = parseTeamMembers(team2);
            const t3 = parseTeamMembers(team3);
            const t4 = parseTeamMembers(team4);
            const maxRows = Math.max(t1.length, t2.length, t3.length, t4.length) || 1;
            const allActiveMembers = [...t1, ...t2, ...t3, ...t4].filter(m => m && !m.isExcluded).map(m => m.name);

            const globalAutoFill = () => {
                if (allActiveMembers.length === 0) {
                    alert("배치할 수 있는 근무자가 명단에 없습니다.");
                    return;
                }
                const firstWorker = schedule[0].cells[0].trim();
                if (!firstWorker || firstWorker === "-") {
                    alert("첫 번째 칸에 시작할 대원 이름을 입력해주세요.");
                    return;
                }
                let currentIndex = allActiveMembers.indexOf(firstWorker);
                if (currentIndex === -1) {
                    alert(`'${firstWorker}' 대원을 명단에서 찾을 수 없습니다.`);
                    return;
                }

                const leaderSet = new Set(leaderArray);
                const currentCounts = {};
                currentCounts[firstWorker] = 1;

                const newSchedule = schedule.map((row, rIndex) => {
                    const newCells = [...row.cells];
                    for (let cIndex = 0; cIndex < newCells.length; cIndex++) {
                        if (rIndex === 0 && cIndex === 0) continue; 
                        if (newCells[cIndex] === "-") continue;

                        let assigned = false;
                        let attempts = 0;
                        while (attempts < allActiveMembers.length) {
                            currentIndex = (currentIndex + 1) % allActiveMembers.length;
                            let candidate = allActiveMembers[currentIndex];
                            let candCount = currentCounts[candidate] || 0;

                            if (leaderSet.has(candidate) && candCount >= 1) {
                                attempts++;
                                continue;
                            }
                            newCells[cIndex] = candidate;
                            currentCounts[candidate] = candCount + 1;
                            assigned = true;
                            break;
                        }
                        if (!assigned) {
                            currentIndex = (currentIndex + 1) % allActiveMembers.length;
                            newCells[cIndex] = allActiveMembers[currentIndex];
                        }
                    }
                    return { ...row, cells: newCells };
                });
                setSchedule(newSchedule);
            };

            return (
                <div className="relative">
                    <datalist id="active-members">
                        {allActiveMembers.map((name, idx) => (<option key={`dl-${idx}`} value={name} />))}
                        <option value="-" />
                    </datalist>

                    <div className="min-h-screen p-4 flex flex-col gap-6 max-w-3xl mx-auto pb-24">
                        <h2 className="text-2xl font-black text-gray-800 text-center tracking-tight">📱 근무표 에디터 (완성형)</h2>
                        
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col gap-4">
                            <h3 className="font-bold text-lg border-b border-gray-100 pb-2 text-blue-700">1. 상단 타이틀 설정</h3>
                            <div>
                                <label className="block text-sm font-semibold text-gray-600 mb-1">날짜</label>
                                <input className="w-full border border-gray-300 rounded-lg p-2.5 outline-none" value={dateStr} onChange={e => setDateStr(e.target.value)} />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-600 mb-1">부대 및 출동장소 ([22기동단 0제대/출동장소])</label>
                                <input className="w-full border border-gray-300 rounded-lg p-2.5 outline-none" value={unitInfo} onChange={e => setUnitInfo(e.target.value)} />
                            </div>
                            <div className="flex gap-3">
                                <div className="w-1/2">
                                    <label className="block text-sm font-semibold text-gray-600 mb-1">총원</label>
                                    <input className="w-full border border-gray-300 rounded-lg p-2.5 outline-none" value={totalCount} onChange={e => setTotalCount(e.target.value)} />
                                </div>
                                <div className="w-1/2">
                                    <label className="block text-sm font-semibold text-gray-600 mb-1">실근무</label>
                                    <input className="w-full border border-gray-300 rounded-lg p-2.5 outline-none" value={activeCount} onChange={e => setActiveCount(e.target.value)} />
                                </div>
                            </div>
                        </div>

                        <div className="bg-yellow-50/80 rounded-2xl shadow-sm border-2 border-yellow-300 p-5 flex flex-col gap-3">
                            <h3 className="font-extrabold text-lg text-yellow-900 border-b-2 border-yellow-300 pb-2">👑 지휘부 (수인/제대장) 특별 관리</h3>
                            <div className="flex gap-2 items-center mt-1">
                                <input className="w-full border-2 border-yellow-400 rounded-lg p-2.5 text-sm font-extrabold outline-none bg-white" value={leaders} onChange={e => setLeaders(e.target.value)} placeholder="최영규, 윤현수" />
                                <button onClick={() => setIsLeaderIncluded(!isLeaderIncluded)} className={`min-w-[125px] px-3 py-3 text-[13px] font-extrabold rounded-lg text-white ${isLeaderIncluded ? 'bg-blue-600' : 'bg-red-500'}`}>
                                    {isLeaderIncluded ? '순환 포함 (1회)' : '순환 일괄 제외'}
                                </button>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col gap-4">
                            <h3 className="font-bold text-lg border-b border-gray-100 pb-2 text-blue-700">2. 부대 명단 및 팀별 실근무 인원</h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {[{t: team1, st: setTeam1, act: teamActive[0]}, {t: team2, st: setTeam2, act: teamActive[1]}, {t: team3, st: setTeam3, act: teamActive[2]}, {t: team4, st: setTeam4, act: teamActive[3]}].map((item, idx) => (
                                    <div key={idx} className="flex flex-col">
                                        <label className="block text-sm font-bold text-gray-700 mb-1">{idx+1}팀 명단</label>
                                        <textarea className="w-full border border-gray-300 rounded-lg p-2 text-sm resize-none outline-none" rows="5" value={item.t} onChange={e => idx===0?setTeam1(e.target.value):idx===1?setTeam2(e.target.value):idx===2?setTeam3(e.target.value):setTeam4(e.target.value)}></textarea>
                                        <div className="mt-2 flex flex-wrap gap-1 min-h-[30px]">
                                            {(idx===0?t1:idx===1?t2:idx===2?t3:t4).map((m, mi) => (
                                                <button key={mi} onClick={() => toggleExclude(m.name)} className={`px-2 py-1 text-xs font-bold rounded ${m.isExcluded ? 'bg-gray-200 text-gray-400 line-through' : m.isLeader ? 'bg-[#fde047] text-yellow-900 border border-yellow-400' : 'bg-blue-100 text-blue-700'}`}>
                                                    {m.name}
                                                </button>
                                            ))}
                                        </div>
                                        <label className="block text-xs font-semibold text-gray-500 mt-2 mb-1">{idx+1}팀 실근무 인원</label>
                                        <input className="w-full border border-gray-300 rounded p-1.5 text-sm text-center font-bold bg-gray-50" value={item.act} onChange={e => updateTeamActive(idx, e.target.value)} />
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col gap-4">
                            <h3 className="font-bold text-lg border-b border-gray-100 pb-2 text-blue-700">3. 금일 상황 및 특이사항</h3>
                            <div>
                                <label className="block text-sm font-semibold text-gray-600 mb-1">집회 상황 (상단 배치)</label>
                                <textarea className="w-full border border-gray-300 rounded-lg p-2.5 resize-none outline-none" rows="2" value={eventNotes} onChange={e => setEventNotes(e.target.value)}></textarea>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-600 mb-1">지각 / 외출 / 조퇴 (하단 배치)</label>
                                <textarea className="w-full border border-gray-300 rounded-lg p-2.5 resize-none outline-none" rows="2" value={personnelNotes} onChange={e => setPersonnelNotes(e.target.value)}></textarea>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col gap-4">
                            <h3 className="font-bold text-lg border-b border-gray-100 pb-2 text-blue-700">4. 시간표 작성</h3>
                            <button onClick={globalAutoFill} className="w-full bg-[#1e3a8a] text-white font-extrabold py-3.5 rounded-lg shadow-md mb-2">
                                ⚡ 첫 근무자 기준 전체 자동 순환배치
                            </button>
                            <div className="overflow-x-auto -mx-5 px-5 pb-2">
                                <table className="w-full border-collapse text-center text-sm md:text-base min-w-[500px]">
                                    <thead>
                                        <tr className="bg-gray-100 border-y-2 border-gray-500">
                                            <th className="py-2 px-1 border-x border-gray-300 w-20">시간</th>
                                            {locations.map((loc, i) => (
                                                <th key={i} className={`py-3 px-1 border-x border-gray-300 relative min-w-[80px] ${loc.color}`}>
                                                    <button onClick={() => toggleLocationColor(i)} className="hide-on-capture absolute top-1 left-1 w-3.5 h-3.5 rounded-full border border-gray-400 z-10 shadow-sm" style={{ backgroundColor: loc.color === 'bg-yellow-200' ? '#fef08a' : loc.color === 'bg-green-300' ? '#86efac' : '#ffffff' }}></button>
                                                    <input className="w-full text-center outline-none bg-transparent font-bold text-lg" value={loc.text} onChange={e => updateLocation(i, e.target.value)} />
                                                    <button onClick={() => removeLocation(i)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-90 hover:opacity-100 transition shadow z-20">×</button>
                                                </th>
                                            ))}
                                            <th className="py-2 px-1 w-12 align-middle border-none">
                                                <button onClick={addLocation} className="text-blue-600 font-bold bg-blue-100 rounded px-2 py-1 w-full text-xs shadow-sm">+</button>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {schedule.map((row, rIndex) => (
                                            <tr key={rIndex} className="border-b border-gray-300 relative group hover:bg-gray-50">
                                                <td className={`py-2 px-1 border-x font-semibold relative ${row.timeColor || 'bg-gray-50'}`}>
                                                    <button onClick={() => toggleTimeColor(rIndex)} className="hide-on-capture absolute top-1 left-1 w-3.5 h-3.5 rounded-full border border-gray-400 z-10 shadow-sm" style={{ backgroundColor: row.timeColor === 'bg-yellow-200' ? '#fef08a' : row.timeColor === 'bg-green-300' ? '#86efac' : '#ffffff' }}></button>
                                                    <input className="w-full text-center outline-none bg-transparent" value={row.time} onChange={e => updateTime(rIndex, e.target.value)} />
                                                </td>
                                                {row.cells.map((cell, cIndex) => (
                                                    <td key={cIndex} className="py-2 px-1 border-x border-gray-300">
                                                        <input className="w-full text-center outline-none bg-transparent" value={cell} onChange={e => updateCell(rIndex, cIndex, e.target.value)} list="active-members" placeholder="입력" />
                                                    </td>
                                                ))}
                                                <td className="py-2 px-1 align-middle border-none relative">
                                                    <button onClick={() => removeRow(rIndex)} className="text-red-400 hover:text-red-600 font-bold text-xl px-2 w-full text-left">×</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <button onClick={addRow} className="w-full bg-gray-50 text-gray-600 py-3 rounded-lg border-2 border-dashed border-gray-300 hover:bg-gray-100 transition font-bold mt-2">+ 시간대 추가</button>
                        </div>

                        <div className="fixed bottom-4 left-0 right-0 px-4 z-50">
                            <button onClick={handleSaveImage} className="w-full max-w-3xl mx-auto bg-[#fae100] text-[#371d1e] font-black py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 text-lg border border-[#e5cf00]">
                                이미지로 변환 (완성형)
                            </button>
                        </div>
                    </div>

                    <div className="capture-wrapper">
                        <div ref={captureRef} className="w-[1250px] min-h-[700px] bg-white p-10 font-sans text-gray-900">
                            <div className="text-center mb-8">
                                <h1 className="text-4xl font-extrabold tracking-tight mb-2">{dateStr}</h1>
                                <div className="text-2xl font-bold text-blue-900">[{unitInfo}]</div>
                            </div>

                            <div className="flex gap-6">
                                <div className="w-[55%] flex flex-col">
                                    <table className="w-full border-collapse text-center">
                                        <thead>
                                            <tr className="bg-gray-100 border-y-2 border-gray-800">
                                                <th className="py-3 px-2 border-x border-gray-400 w-24 text-lg font-extrabold">시간</th>
                                                {locations.map((loc, i) => (<th key={i} className={`py-3 px-2 border-x border-gray-400 text-lg font-extrabold ${loc.color}`}>{loc.text}</th>))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {schedule.map((row, rIndex) => (
                                                <tr key={rIndex} className="border-b border-gray-300">
                                                    <td className={`py-3 px-2 border-x border-gray-400 font-extrabold text-lg ${row.timeColor || 'bg-gray-50'}`}>{row.time}</td>
                                                    {row.cells.map((cell, cIndex) => (<td key={cIndex} className="py-3 px-2 border-x border-gray-400 text-lg font-semibold">{cell}</td>))}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="w-[45%] flex flex-col gap-4">
                                    <table className="w-full border-collapse text-center border-2 border-gray-900 bg-white">
                                        <thead>
                                            <tr className="border-b-2 border-gray-900 font-bold text-lg">
                                                <td colSpan="4" className="border-r border-gray-900 py-1.5 bg-gray-50">총원 {totalCount}명</td>
                                                <td colSpan="4" className="py-1.5 bg-gray-50">실근무 {activeCount}명</td>
                                            </tr>
                                            <tr className="bg-[#dbeafe] border-b border-gray-900 text-base">
                                                <th colSpan="2" className="border-r border-gray-900 py-1 font-extrabold text-blue-900">1팀</th>
                                                <th colSpan="2" className="border-r border-gray-900 py-1 font-extrabold text-blue-900">2팀</th>
                                                <th colSpan="2" className="border-r border-gray-900 py-1 font-extrabold text-blue-900">3팀</th>
                                                <th colSpan="2" className="py-1 font-extrabold text-blue-900">4팀</th>
                                            </tr>
                                            <tr className="bg-gray-100 border-b-2 border-gray-900 text-sm font-bold text-gray-800">
                                                <th className="border-r border-gray-400 py-1">이름</th>
                                                <th className="border-r border-gray-900 py-1 bg-gray-200">근무수</th>
                                                <th className="border-r border-gray-400 py-1">이름</th>
                                                <th className="border-r border-gray-900 py-1 bg-gray-200">근무수</th>
                                                <th className="border-r border-gray-400 py-1">이름</th>
                                                <th className="border-r border-gray-900 py-1 bg-gray-200">근무수</th>
                                                <th className="border-r border-gray-400 py-1">이름</th>
                                                <th className="py-1 bg-gray-200">근무수</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {Array.from({ length: maxRows }).map((_, i) => (
                                                <tr key={i} className="border-b border-gray-400 text-[15px]">
                                                    <td className={`border-r border-gray-400 py-1.5 font-medium ${t1[i]?.isLeader ? 'bg-[#ffff00]' : ''} ${t1[i]?.isExcluded ? 'line-through text-gray-400' : ''}`}>{t1[i]?.name || ''}</td>
                                                    <td className={`border-r border-gray-900 py-1.5 font-bold ${t1[i]?.isLeader ? 'bg-[#ffff00]' : ''} ${t1[i]?.isExcluded ? 'line-through text-gray-400' : ''}`}>{t1[i]?.display ?? ''}</td>
                                                    <td className={`border-r border-gray-400 py-1.5 font-medium ${t2[i]?.isLeader ? 'bg-[#ffff00]' : ''} ${t2[i]?.isExcluded ? 'line-through text-gray-400' : ''}`}>{t2[i]?.name || ''}</td>
                                                    <td className={`border-r border-gray-900 py-1.5 font-bold ${t2[i]?.isLeader ? 'bg-[#ffff00]' : ''} ${t2[i]?.isExcluded ? 'line-through text-gray-400' : ''}`}>{t2[i]?.display ?? ''}</td>
                                                    <td className={`border-r border-gray-400 py-1.5 font-medium ${t3[i]?.isLeader ? 'bg-[#ffff00]' : ''} ${t3[i]?.isExcluded ? 'line-through text-gray-400' : ''}`}>{t3[i]?.name || ''}</td>
                                                    <td className={`border-r border-gray-900 py-1.5 font-bold ${t3[i]?.isLeader ? 'bg-[#ffff00]' : ''} ${t3[i]?.isExcluded ? 'line-through text-gray-400' : ''}`}>{t3[i]?.display ?? ''}</td>
                                                    <td className={`border-r border-gray-400 py-1.5 font-medium ${t4[i]?.isLeader ? 'bg-[#ffff00]' : ''} ${t4[i]?.isExcluded ? 'line-through text-gray-400' : ''}`}>{t4[i]?.name || ''}</td>
                                                    <td className={`py-1.5 font-bold ${t4[i]?.isLeader ? 'bg-[#ffff00]' : ''} ${t4[i]?.isExcluded ? 'line-through text-gray-400' : ''}`}>{t4[i]?.display ?? ''}</td>
                                                </tr>
                                            ))}
                                            <tr className="border-t-2 border-gray-900 font-extrabold text-base bg-gray-50">
                                                <td colSpan="2" className="border-r border-gray-900 py-2">{teamActive[0]}</td>
                                                <td colSpan="2" className="border-r border-gray-900 py-2">{teamActive[1]}</td>
                                                <td colSpan="2" className="border-r border-gray-900 py-2">{teamActive[2]}</td>
                                                <td colSpan="2" className="py-2">{teamActive[3]}</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <div className="border-4 border-[#1e3a8a] bg-[#eff6ff] p-6 rounded-2xl flex flex-col h-full shadow-md">
                                        <h3 className="text-2xl font-black text-[#1e3a8a] border-b-4 border-[#1e3a8a] pb-3 mb-4 flex items-center gap-2">
                                            📌 금일 상황 및 특이사항
                                        </h3>
                                        {eventNotes && (
                                            <div className="mb-4">
                                                <div className="font-extrabold text-[17px] text-blue-950 mb-1.5">[집회상황]</div>
                                                <div className="whitespace-pre-wrap text-[16px] font-bold leading-relaxed text-gray-900">
                                                    {eventNotes}
                                                </div>
                                            </div>
                                        )}
                                        {personnelNotes && (
                                            <div className="mt-auto pt-3 border-t-2 border-blue-300">
                                                <div className="whitespace-pre-wrap text-[16px] font-bold leading-relaxed text-gray-900">
                                                    {personnelNotes}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
