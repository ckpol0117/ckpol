<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경찰 기동대 스마트 근무표</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone CDN for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas CDN for high-resolution image export -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        /* Off-screen wrapper for high-resolution landscape image capture */
        .capture-wrapper {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
        /* Subtle datalist indicator for mobile usability */
        input::-webkit-calendar-picker-indicator {
            opacity: 0.5;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useMemo } = React;

        // Preset time slot definitions for the 4 mobile unit duty patterns
        const PATTERN_CONFIG = {
            "거점": {
                label: "거점",
                desc: "07:40~19:40 (1시간)",
                times: [
                    "07:40~08:40", "08:40~09:40", "09:40~10:40", "10:40~11:40",
                    "11:40~12:40", "12:40~13:40", "13:40~14:40", "14:40~15:40",
                    "15:40~16:40", "16:40~17:40", "17:40~18:40", "18:40~19:40"
                ]
            },
            "상황": {
                label: "상황",
                desc: "시간 수동설정 (1시간)",
                times: []
            },
            "민생치안": {
                label: "민생치안",
                desc: "14:00~21:00 (1시간)",
                times: [
                    "14:00~15:00", "15:00~16:00", "16:00~17:00", "17:00~18:00",
                    "18:00~19:00", "19:00~20:00", "20:00~21:00"
                ]
            },
            "당직": {
                label: "당직",
                desc: "19:40~07:40 (1시간30분)",
                times: [
                    "19:40~21:10", "21:10~22:40", "22:40~00:10", "00:10~01:40",
                    "01:40~03:10", "03:10~04:40", "04:40~06:10", "06:10~07:40"
                ]
            }
        };

        // Leader rotation options (0 = excluded, 1~3 = max shifts in auto-rotation)
        const LEADER_SHIFT_OPTIONS = [
            { value: 0, label: "순환 제외", activeClass: "bg-red-600 text-white border-red-600 shadow-sm" },
            { value: 1, label: "순환포함 1회", activeClass: "bg-blue-600 text-white border-blue-600 shadow-sm" },
            { value: 2, label: "순환포함 2회", activeClass: "bg-blue-600 text-white border-blue-600 shadow-sm" },
            { value: 3, label: "순환포함 3회", activeClass: "bg-blue-600 text-white border-blue-600 shadow-sm" }
        ];

        // Helper: Convert "HH:MM" string to total minutes from midnight
        const parseTimeToMinutes = (timeStr) => {
            if (!timeStr || !timeStr.includes(":")) return null;
            const [hStr, mStr] = timeStr.split(":");
            const h = parseInt(hStr, 10);
            const m = parseInt(mStr, 10);
            if (isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
            return h * 60 + m;
        };

        // Helper: Format total minutes (wrapping 24h) as "HH:MM"
        const formatMinutesToTime = (totalMinutes) => {
            const normalized = ((totalMinutes % 1440) + 1440) % 1440;
            const h = Math.floor(normalized / 60);
            const m = normalized % 60;
            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
        };

        // Helper: Generate 1-hour interval slots between start and end (supports crossing midnight)
        const generateHourlySlots = (startStr, endStr) => {
            const startMin = parseTimeToMinutes(startStr);
            const endMinRaw = parseTimeToMinutes(endStr);
            if (startMin === null || endMinRaw === null) return null;
            if (startMin === endMinRaw) return [];

            const endMin = endMinRaw < startMin ? endMinRaw + 1440 : endMinRaw;
            const slots = [];
            let curr = startMin;
            while (curr < endMin) {
                const next = Math.min(curr + 60, endMin);
                slots.push(`${formatMinutesToTime(curr)}~${formatMinutesToTime(next)}`);
                curr = next;
            }
            return slots;
        };

        const App = () => {
            // 1. Header & Title State (Single-line export: {unitTitle} ( {dispatchLocation} / {dateStr} ))
            const [unitTitle, setUnitTitle] = useState("22기 2제대 근무일지");
            const [dispatchLocation, setDispatchLocation] = useState("노원(370)관내 민생치안");
            const [dateStr, setDateStr] = useState("2026-11-19");

            const [totalCount, setTotalCount] = useState("21");
            const [activeCount, setActiveCount] = useState("16");

            // 2. Duty Pattern State (Default: 민생치안)
            const [dutyPattern, setDutyPattern] = useState("민생치안");
            const [manualStartTime, setManualStartTime] = useState("09:00");
            const [manualEndTime, setManualEndTime] = useState("18:00");

            // 3. Special Notes State (Each non-empty line renders with ✔ checkmark)
            const [eventNotes, setEventNotes] = useState("노원(370)관내 민생치안");
            const [personnelNotes, setPersonnelNotes] = useState("순경 심규성 09:00-13:30 (육아/지각)");

            // 4. Leaders Special Management State (0 = excluded, 1~3 = max shifts)
            const [leaders, setLeaders] = useState("최영규, 윤현수");
            const [leaderMaxShifts, setLeaderMaxShifts] = useState(1);

            // 5. Team Rosters & Active Counts State
            const [team1, setTeam1] = useState("서동준\n안창성\n윤현수\n이동수\n심규성\n최영규");
            const [team2, setTeam2] = useState("유제민\n이준호\n안대철\n최장원");
            const [team3, setTeam3] = useState("김희수\n이주원\n박종석\n고창희");
            const [team4, setTeam4] = useState("김민구\n박인태\n성준영\n황백규\n정진원\n김성현:항해사");

            const [teamActive, setTeamActive] = useState(["4명", "4명", "4명", "4명"]);
            const [excludedNames, setExcludedNames] = useState([]);

            // 6. Schedule Locations & Rows State
            const [locations, setLocations] = useState([
                { text: "유동1", color: "" },
                { text: "유동2", color: "" },
                { text: "유동3", color: "" },
                { text: "유동4", color: "" }
            ]);

            const [schedule, setSchedule] = useState(
                PATTERN_CONFIG["민생치안"].times.map((t, idx) => ({
                    time: t,
                    timeColor: idx === 0 ? "bg-yellow-100" : "",
                    cells:
                        idx === 0 ? ["성준영", "황백규", "서동준", "안창성"] :
                        idx === 1 ? ["심규성", "유제민", "이준호", "안대철"] :
                        idx === 2 ? ["최장원", "김희수", "이주원", "박종석"] :
                        idx === 3 ? ["고창희", "김민구", "박인태", "성준영"] :
                        idx === 4 ? ["황백규", "서동준", "안창성", "심규성"] :
                        idx === 5 ? ["유제민", "이준호", "안대철", "최장원"] :
                        ["김희수", "이주원", "박종석", "고창희"]
                }))
            );

            // Non-blocking toast notification state (replaces browser alert())
            const [notice, setNotice] = useState(null);
            const noticeTimerRef = useRef(null);
            const captureRef = useRef(null);

            const showNotice = (message, type = "info") => {
                if (noticeTimerRef.current) {
                    clearTimeout(noticeTimerRef.current);
                }
                setNotice({ message, type });
                noticeTimerRef.current = setTimeout(() => {
                    setNotice(null);
                }, 3500);
            };

            // Build fresh schedule rows from a list of time strings while preserving column count & first worker
            const buildScheduleFromTimes = (timesList) => {
                const existingFirstWorker = schedule[0]?.cells[0] || "";
                return timesList.map((t, idx) => {
                    const cells = Array(locations.length).fill("");
                    if (idx === 0 && cells.length > 0 && existingFirstWorker) {
                        cells[0] = existingFirstWorker;
                    }
                    return {
                        time: t,
                        timeColor: idx === 0 ? "bg-yellow-100" : "",
                        cells
                    };
                });
            };

            // Handle switching duty patterns
            const handlePatternSelect = (patternKey) => {
                setDutyPattern(patternKey);
                if (patternKey === "상황") {
                    showNotice("상황 근무: 시작/종료 시간을 입력 후 [시간표 자동 생성]을 눌러주세요.", "info");
                    return;
                }
                const presetTimes = PATTERN_CONFIG[patternKey].times;
                setSchedule(buildScheduleFromTimes(presetTimes));
                showNotice(`[${patternKey}] 시간표(${presetTimes.length}개 구간)가 적용되었습니다.`, "success");
            };

            // Handle manual 1-hour schedule generation for [상황] pattern
            const handleGenerateManualSchedule = () => {
                const slots = generateHourlySlots(manualStartTime, manualEndTime);
                if (slots === null) {
                    showNotice("시작 시간과 종료 시간을 올바르게 입력해주세요.", "error");
                    return;
                }
                if (slots.length === 0) {
                    showNotice("시작 시간과 종료 시간을 다르게 설정해주세요.", "error");
                    return;
                }
                setSchedule(buildScheduleFromTimes(slots));
                showNotice(`[상황] ${manualStartTime}~${manualEndTime} (${slots.length}개 구간) 시간표가 생성되었습니다.`, "success");
            };

            // Toggle manual exclusion for an individual member
            const toggleExclude = (name) => {
                setExcludedNames(prev =>
                    prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]
                );
            };

            // Export hidden 1300px-wide capture template as high-resolution PNG
            const handleSaveImage = async () => {
                try {
                    const container = captureRef.current;
                    if (!container) return;
                    const canvas = await html2canvas(container, {
                        scale: 2.5,
                        backgroundColor: "#ffffff"
                    });
                    const link = document.createElement("a");
                    link.download = `기동대_근무표_${dateStr}_${dutyPattern}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    showNotice("근무표 이미지가 저장되었습니다.", "success");
                } catch (err) {
                    console.error("Image export error:", err);
                    showNotice("이미지 저장 중 오류가 발생했습니다. 다시 시도해주세요.", "error");
                }
            };

            // Location column handlers
            const addLocation = () => {
                setLocations([...locations, { text: "새 근무지", color: "" }]);
                setSchedule(schedule.map(row => ({ ...row, cells: [...row.cells, ""] })));
            };

            const removeLocation = (index) => {
                if (locations.length <= 1) {
                    showNotice("최소 1개의 근무지는 유지해야 합니다.", "error");
                    return;
                }
                setLocations(locations.filter((_, i) => i !== index));
                setSchedule(schedule.map(row => ({ ...row, cells: row.cells.filter((_, i) => i !== index) })));
            };

            const updateLocation = (index, value) => {
                const newLocs = [...locations];
                newLocs[index] = { ...newLocs[index], text: value };
                setLocations(newLocs);
            };

            const toggleLocationColor = (index) => {
                const newLocs = [...locations];
                const curr = newLocs[index].color;
                const nextColor = curr === "" ? "bg-yellow-200" : curr === "bg-yellow-200" ? "bg-green-300" : "";
                newLocs[index] = { ...newLocs[index], color: nextColor };
                setLocations(newLocs);
            };

            // Schedule row handlers
            const updateTime = (index, value) => {
                const newSchedule = [...schedule];
                newSchedule[index] = { ...newSchedule[index], time: value };
                setSchedule(newSchedule);
            };

            const toggleTimeColor = (index) => {
                const newSched = [...schedule];
                const curr = newSched[index].timeColor;
                const nextColor = curr === "" ? "bg-yellow-200" : curr === "bg-yellow-200" ? "bg-green-300" : "";
                newSched[index] = { ...newSched[index], timeColor: nextColor };
                setSchedule(newSched);
            };

            const updateCell = (rIndex, cIndex, value) => {
                const newSchedule = [...schedule];
                const updatedCells = [...newSchedule[rIndex].cells];
                updatedCells[cIndex] = value;
                newSchedule[rIndex] = { ...newSchedule[rIndex], cells: updatedCells };
                setSchedule(newSchedule);
            };

            const addRow = () => {
                setSchedule([
                    ...schedule,
                    { time: "00:00~01:00", timeColor: "", cells: Array(locations.length).fill("") }
                ]);
            };

            const removeRow = (index) => {
                if (schedule.length <= 1) {
                    showNotice("최소 1개의 시간대는 유지해야 합니다.", "error");
                    return;
                }
                setSchedule(schedule.filter((_, i) => i !== index));
            };

            const updateTeamActive = (index, value) => {
                const newActive = [...teamActive];
                newActive[index] = value;
                setTeamActive(newActive);
            };

            // Real-time work shift counts across all schedule cells
            const workCounts = useMemo(() => {
                const counts = {};
                schedule.forEach(row => {
                    row.cells.forEach(cell => {
                        const name = cell.trim();
                        if (name && name !== "-") {
                            counts[name] = (counts[name] || 0) + 1;
                        }
                    });
                });
                return counts;
            }, [schedule]);

            const leaderArray = leaders.split(",").map(s => s.trim()).filter(Boolean);

            // Parse team rosters and support "이름:표시값" syntax (e.g., 김성현:항해사)
            const parseTeamMembers = (teamStr) => {
                return teamStr
                    .split("\n")
                    .map(line => {
                        const trimmed = line.trim();
                        if (!trimmed) return null;
                        let name = trimmed;
                        let display = null;
                        if (trimmed.includes(":")) {
                            const parts = trimmed.split(":");
                            name = parts[0].trim();
                            display = parts.slice(1).join(":").trim();
                        }
                        const isLeader = leaderArray.includes(name);
                        const isManuallyExcluded = excludedNames.includes(name);
                        const isRotationExcluded = isManuallyExcluded || (isLeader && leaderMaxShifts === 0);
                        return {
                            name,
                            display: display !== null ? display : (workCounts[name] || 0),
                            isManuallyExcluded,
                            isRotationExcluded,
                            isLeader
                        };
                    })
                    .filter(Boolean);
            };

            const t1 = parseTeamMembers(team1);
            const t2 = parseTeamMembers(team2);
            const t3 = parseTeamMembers(team3);
            const t4 = parseTeamMembers(team4);
            const maxRows = Math.max(t1.length, t2.length, t3.length, t4.length) || 1;

            // Active members for datalist autocomplete (excludes only manually excluded members)
            const datalistMembers = [...t1, ...t2, ...t3, ...t4]
                .filter(m => m && !m.isManuallyExcluded)
                .map(m => m.name);

            // Rotation pool for auto-fill (excludes manually excluded members AND leaders when leaderMaxShifts === 0)
            const rotationPool = [...t1, ...t2, ...t3, ...t4]
                .filter(m => m && !m.isRotationExcluded)
                .map(m => m.name);

            // Automatic full-schedule rotation starting from schedule[0].cells[0]
            const globalAutoFill = () => {
                try {
                    if (!schedule.length || !schedule[0].cells.length) {
                        showNotice("시간표 칸이 비어 있습니다.", "error");
                        return;
                    }

                    const firstWorker = schedule[0].cells[0].trim();
                    if (!firstWorker || firstWorker === "-") {
                        showNotice("첫 번째 칸에 시작할 대원 이름을 입력해주세요.", "error");
                        return;
                    }

                    const leaderSet = new Set(leaderArray);

                    // Guard: first worker is a leader while leaderMaxShifts === 0
                    if (leaderSet.has(firstWorker) && leaderMaxShifts === 0) {
                        showNotice(
                            "지휘부가 '순환 제외' 상태입니다. 첫 근무자를 변경하거나 순환포함 횟수(1~3회)를 선택해주세요.",
                            "error"
                        );
                        return;
                    }

                    if (rotationPool.length === 0) {
                        showNotice("배치할 수 있는 근무자가 명단에 없습니다.", "error");
                        return;
                    }

                    let currentIndex = rotationPool.indexOf(firstWorker);
                    if (currentIndex === -1) {
                        showNotice(`'${firstWorker}' 대원을 실근무 명단에서 찾을 수 없습니다.`, "error");
                        return;
                    }

                    const currentCounts = {};
                    currentCounts[firstWorker] = 1;

                    const newSchedule = schedule.map((row, rIndex) => {
                        const newCells = [...row.cells];
                        for (let cIndex = 0; cIndex < newCells.length; cIndex++) {
                            if (rIndex === 0 && cIndex === 0) continue;
                            if (newCells[cIndex] === "-") continue;

                            let assigned = false;
                            let attempts = 0;
                            while (attempts < rotationPool.length) {
                                currentIndex = (currentIndex + 1) % rotationPool.length;
                                const candidate = rotationPool[currentIndex];
                                const candCount = currentCounts[candidate] || 0;

                                // Skip leader if they have reached the configured leaderMaxShifts limit
                                if (leaderSet.has(candidate) && candCount >= leaderMaxShifts) {
                                    attempts++;
                                    continue;
                                }
                                newCells[cIndex] = candidate;
                                currentCounts[candidate] = candCount + 1;
                                assigned = true;
                                break;
                            }

                            // Fallback if every member in the pool is a leader at max shifts
                            if (!assigned) {
                                currentIndex = (currentIndex + 1) % rotationPool.length;
                                newCells[cIndex] = rotationPool[currentIndex];
                            }
                        }
                        return { ...row, cells: newCells };
                    });

                    setSchedule(newSchedule);
                    const leaderMsg = leaderMaxShifts === 0 ? "지휘부 순환 제외" : `지휘부 최대 ${leaderMaxShifts}회`;
                    showNotice(`전체 자동 순환배치 완료 (${leaderMsg})`, "success");
                } catch (err) {
                    console.error("Auto-fill error:", err);
                    showNotice("자동 배치 중 오류가 발생했습니다.", "error");
                }
            };

            // Split special notes into non-empty lines for ✔ checkmark rendering
            const eventLines = eventNotes
                .split("\n")
                .map(line => line.trim())
                .filter(Boolean);

            const personnelLines = personnelNotes
                .split("\n")
                .map(line => line.trim())
                .filter(Boolean);

            return (
                <div className="relative">
                    {/* Toast Notification Banner */}
                    {notice && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md">
                            <div
                                className={`px-4 py-3 rounded-xl shadow-lg text-sm font-bold text-center border ${
                                    notice.type === "error"
                                        ? "bg-red-600 text-white border-red-700"
                                        : notice.type === "success"
                                        ? "bg-blue-900 text-white border-blue-950"
                                        : "bg-gray-800 text-white border-gray-900"
                                }`}
                            >
                                {notice.message}
                            </div>
                        </div>
                    )}

                    {/* Autocomplete datalist for schedule inputs */}
                    <datalist id="active-members">
                        {datalistMembers.map((name, idx) => (
                            <option key={`dl-${idx}`} value={name} />
                        ))}
                        <option value="-" />
                    </datalist>

                    {/* Mobile-first Responsive Editor */}
                    <div className="min-h-screen p-4 flex flex-col gap-6 max-w-3xl mx-auto pb-28">
                        <h2 className="text-2xl font-black text-gray-800 text-center tracking-tight">
                            📱 근무표 에디터 (완성형)
                        </h2>

                        {/* Section 1: Header & Title Settings */}
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col gap-4">
                            <h3 className="font-bold text-lg border-b border-gray-100 pb-2 text-blue-700">
                                1. 상단 타이틀 설정
                            </h3>
                            <div>
                                <label className="block text-sm font-semibold text-gray-600 mb-1">
                                    기수/제대 제목 (예: 22기 2제대 근무일지)
                                </label>
                                <input
                                    className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500"
                                    value={unitTitle}
                                    onChange={e => setUnitTitle(e.target.value)}
                                />
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-600 mb-1">
                                        출동장소
                                    </label>
                                    <input
                                        className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500"
                                        value={dispatchLocation}
                                        onChange={e => setDispatchLocation(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-600 mb-1">
                                        날짜
                                    </label>
                                    <input
                                        className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500"
                                        value={dateStr}
                                        onChange={e => setDateStr(e.target.value)}
                                    />
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <div className="w-1/2">
                                    <label className="block text-sm font-semibold text-gray-600 mb-1">
                                        총원
                                    </label>
                                    <input

    </script>
