<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경찰 기동대 스마트 근무표</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone CDN for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2canvas CDN for high-resolution image export -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        /* Off-screen wrapper for high-resolution landscape PNG capture */
        .capture-wrapper {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
        /* Subtle datalist indicator for mobile usability */
        input::-webkit-calendar-picker-indicator {
            opacity: 0.5;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useMemo, useEffect } = React;

        // LocalStorage persistence keys (v3 primary, v2 fallback for seamless migration)
        const STORAGE_KEY = "police_smart_scheduler_v3";
        const LEGACY_STORAGE_KEYS = ["police_smart_scheduler_v2", "police_smart_scheduler_v1"];

        // Preset time slot definitions for the 4 duty patterns (Exact order: 거점, 당직, 민생치안, 기타)
        const PATTERN_CONFIG = {
            "거점": {
                label: "거점",
                desc: "07:40~19:40 (1시간)",
                times: [
                    "07:40", "08:40", "09:40", "10:40",
                    "11:40", "12:40", "13:40", "14:40",
                    "15:40", "16:40", "17:40", "18:40"
                ]
            },
            "당직": {
                label: "당직",
                desc: "19:40~07:40 (1시간30분)",
                times: [
                    "19:40", "21:10", "22:40", "00:10",
                    "01:40", "03:10", "04:40", "06:10"
                ]
            },
            "민생치안": {
                label: "민생치안",
                desc: "14:00~21:00 (1시간)",
                times: [
                    "14:00", "15:00", "16:00", "17:00",
                    "18:00", "19:00", "20:00"
                ]
            },
            "기타": {
                label: "기타",
                desc: "시간·간격 수동설정",
                times: []
            }
        };

        // Interval options for [기타] pattern (30 / 60 / 90 minutes)
        const INTERVAL_OPTIONS = [
            { value: 30, label: "30분" },
            { value: 60, label: "60분" },
            { value: 90, label: "90분" }
        ];

        // Leader rotation options (0 = excluded, 1~3 = max shifts in auto-rotation)
        const LEADER_SHIFT_OPTIONS = [
            { value: 0, label: "순환 제외", activeClass: "bg-red-600 text-white border-red-600 shadow-sm" },
            { value: 1, label: "순환포함 1회", activeClass: "bg-blue-600 text-white border-blue-600 shadow-sm" },
            { value: 2, label: "순환포함 2회", activeClass: "bg-blue-600 text-white border-blue-600 shadow-sm" },
            { value: 3, label: "순환포함 3회", activeClass: "bg-blue-600 text-white border-blue-600 shadow-sm" }
        ];

        // Default state for general distribution using official Korean police ranks ([계급 이름])
        const getDefaultState = () => ({
            unitTitle: "00기 0제대 근무일지",
            dispatchLocation: "출동장소",
            dateStr: "2026-11-24",
            totalCount: "21",
            activeCount: "16",
            dutyPattern: "거점",
            customStartTime: "08:00",
            customEndTime: "18:00",
            customInterval: 60,
            leaders: "경감 홍길동, 경위 김철수",
            leaderMaxShifts: 1,
            team1: "경감 홍길동\n경위 김철수\n경사 박민수\n경장 최지훈\n순경 정우성\n순경 강태오",
            team2: "경위 한지민\n경사 오세훈\n경장 서강준\n순경 윤아름\n순경 이도현",
            team3: "경위 조진웅\n경사 김태리\n경장 남주혁\n순경 송하윤\n순경 송강",
            team4: "경위 류준열\n경사 신혜선\n경장 안효섭\n순경 박보영\n경사 김성현:항해사",
            teamActive: ["4명", "4명", "4명", "4명"],
            excludedNames: [],
            eventNotes: "OO노조 집회 08:00~15:00 주요 거점 앞\n시설물 보호 및 질서유지 철저",
            personnelNotes: "순경 정우성 09:00-13:30 (육아/지각)",
            locations: [
                { text: "유동1", color: "" },
                { text: "유동2", color: "" },
                { text: "유동3", color: "" },
                { text: "유동4", color: "" }
            ],
            schedule: [
                { time: "07:40", timeColor: "bg-yellow-100", cells: ["경사 박민수", "경장 최지훈", "순경 정우성", "순경 강태오"] },
                { time: "08:40", timeColor: "", cells: ["경위 한지민", "경사 오세훈", "경장 서강준", "순경 윤아름"] },
                { time: "09:40", timeColor: "", cells: ["순경 이도현", "경위 조진웅", "경사 김태리", "경장 남주혁"] },
                { time: "10:40", timeColor: "", cells: ["순경 송하윤", "순경 송강", "경위 류준열", "경사 신혜선"] },
                { time: "11:40", timeColor: "", cells: ["경장 안효섭", "순경 박보영", "경감 홍길동", "경위 김철수"] },
                { time: "12:40", timeColor: "", cells: ["경사 박민수", "경장 최지훈", "순경 정우성", "순경 강태오"] },
                { time: "13:40", timeColor: "", cells: ["경위 한지민", "경사 오세훈", "경장 서강준", "순경 윤아름"] },
                { time: "14:40", timeColor: "", cells: ["순경 이도현", "경위 조진웅", "경사 김태리", "경장 남주혁"] },
                { time: "15:40", timeColor: "", cells: ["순경 송하윤", "순경 송강", "경위 류준열", "경사 신혜선"] },
                { time: "16:40", timeColor: "", cells: ["경장 안효섭", "순경 박보영", "경사 박민수", "경장 최지훈"] },
                { time: "17:40", timeColor: "", cells: ["순경 정우성", "순경 강태오", "경위 한지민", "경사 오세훈"] },
                { time: "18:40", timeColor: "", cells: ["경장 서강준", "순경 윤아름", "순경 이도현", "경위 조진웅"] }
            ]
        });

        // Safely load persisted state from localStorage (with legacy key fallback & '상황' -> '기타' migration)
        const loadSavedState = () => {
            const defaults = getDefaultState();
            try {
                let raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) {
                    for (const oldKey of LEGACY_STORAGE_KEYS) {
                        const legacyRaw = localStorage.getItem(oldKey);
                        if (legacyRaw) {
                            raw = legacyRaw;
                            break;
                        }
                    }
                }
                if (!raw) return defaults;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== "object") return defaults;

                // Migrate legacy "상황" pattern name to "기타"
                let resolvedPattern = parsed.dutyPattern === "상황" ? "기타" : parsed.dutyPattern;
                if (!PATTERN_CONFIG[resolvedPattern]) {
                    resolvedPattern = defaults.dutyPattern;
                }

                // Validate customInterval (30, 60, or 90)
                const resolvedInterval = [30, 60, 90].includes(Number(parsed.customInterval))
                    ? Number(parsed.customInterval)
                    : defaults.customInterval;

                // Validate leaderMaxShifts (0, 1, 2, or 3)
                const resolvedLeaderMax = [0, 1, 2, 3].includes(Number(parsed.leaderMaxShifts))
                    ? Number(parsed.leaderMaxShifts)
                    : defaults.leaderMaxShifts;

                return {
                    ...defaults,
                    ...parsed,
                    dutyPattern: resolvedPattern,
                    customInterval: resolvedInterval,
                    leaderMaxShifts: resolvedLeaderMax,
                    teamActive: Array.isArray(parsed.teamActive) && parsed.teamActive.length === 4 ? parsed.teamActive : defaults.teamActive,
                    excludedNames: Array.isArray(parsed.excludedNames) ? parsed.excludedNames : defaults.excludedNames,
                    locations: Array.isArray(parsed.locations) && parsed.locations.length > 0 ? parsed.locations : defaults.locations,
                    schedule: Array.isArray(parsed.schedule) && parsed.schedule.length > 0 ? parsed.schedule : defaults.schedule
                };
            } catch (err) {
                console.error("Failed to load saved state:", err);
                return defaults;
            }
        };

        // Helper: Convert "HH:MM" string to total minutes from midnight
        const parseTimeToMinutes = (timeStr) => {
            if (!timeStr || !timeStr.includes(":")) return null;
            const [hStr, mStr] = timeStr.split(":");
            const h = parseInt(hStr, 10);
            const m = parseInt(mStr, 10);
            if (isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
            return h * 60 + m;
        };

        // Helper: Format total minutes (wrapping 24h) as "HH:MM"
        const formatMinutesToTime = (totalMinutes) => {
            const normalized = ((totalMinutes % 1440) + 1440) % 1440;
            const h = Math.floor(normalized / 60);
            const m = normalized % 60;
            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
        };

        // Helper: Generate time slots at a chosen interval (30, 60, or 90 minutes, supports overnight/next day)
        const generateTimeSlots = (startStr, endStr, intervalMinutes = 60) => {
            const startMin = parseTimeToMinutes(startStr);
            const endMinRaw = parseTimeToMinutes(endStr);
            const step = Number(intervalMinutes);
            if (startMin === null || endMinRaw === null || isNaN(step) || step <= 0) return null;
            if (startMin === endMinRaw) return [];

            const endMin = endMinRaw < startMin ? endMinRaw + 1440 : endMinRaw;
            const slots = [];
            let curr = startMin;
            while (curr < endMin) {
                slots.push(formatMinutesToTime(curr));
                curr += step;
            }
            return slots;
        };

        // Helper: Copy text reliably across mobile browsers & iframes via execCommand('copy')
        const copyTextToClipboard = (text) => {
            try {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.setAttribute("readonly", "");
                textarea.style.position = "fixed";
                textarea.style.left = "-9999px";
                textarea.style.top = "0";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                const successful = document.execCommand("copy");
                document.body.removeChild(textarea);
                return successful;
            } catch (err) {
                console.error("Clipboard copy error:", err);
                return false;
            }
        };

        const App = () => {
            // Initialize all state once from localStorage
            const initial = useMemo(() => loadSavedState(), []);

            // 1. Header & Title State
            const [unitTitle, setUnitTitle] = useState(initial.unitTitle);
            const [dispatchLocation, setDispatchLocation] = useState(initial.dispatchLocation);
            const [dateStr, setDateStr] = useState(initial.dateStr);
            const [totalCount, setTotalCount] = useState(initial.totalCount);
            const [activeCount, setActiveCount] = useState(initial.activeCount);

            // 2. Duty Pattern State
            const [dutyPattern, setDutyPattern] = useState(initial.dutyPattern);
            const [customStartTime, setCustomStartTime] = useState(initial.customStartTime);
            const [customEndTime, setCustomEndTime] = useState(initial.customEndTime);
            const [customInterval, setCustomInterval] = useState(initial.customInterval);

            // 3. Leaders Special Management State
            const [leaders, setLeaders] = useState(initial.leaders);
            const [leaderMaxShifts, setLeaderMaxShifts] = useState(initial.leaderMaxShifts);

            // 4. Team Rosters & Active Counts State
            const [team1, setTeam1] = useState(initial.team1);
            const [team2, setTeam2] = useState(initial.team2);
            const [team3, setTeam3] = useState(initial.team3);
            const [team4, setTeam4] = useState(initial.team4);
            const [teamActive, setTeamActive] = useState(initial.teamActive);
            const [excludedNames, setExcludedNames] = useState(initial.excludedNames);

            // 5. Special Notes State
            const [eventNotes, setEventNotes] = useState(initial.eventNotes);
            const [personnelNotes, setPersonnelNotes] = useState(initial.personnelNotes);

            // 6. Schedule Locations & Rows State
            const [locations, setLocations] = useState(initial.locations);
            const [schedule, setSchedule] = useState(initial.schedule);

            // UI Feedback & Custom Modal States (no browser alert/confirm)
            const [justSaved, setJustSaved] = useState(false);
            const [notice, setNotice] = useState(null);
            const [showResetModal, setShowResetModal] = useState(false);
            const [showImportModal, setShowImportModal] = useState(false);
            const [importText, setImportText] = useState("");

            const noticeTimerRef = useRef(null);
            const saveTimerRef = useRef(null);
            const captureRef = useRef(null);

            const showNotice = (message, type = "info") => {
                if (noticeTimerRef.current) clearTimeout(noticeTimerRef.current);
                setNotice({ message, type });
                noticeTimerRef.current = setTimeout(() => {
                    setNotice(null);
                }, 3600);
            };

            // Auto-Save Effect: persist all state changes to localStorage
            useEffect(() => {
                try {
                    const payload = {
                        unitTitle,
                        dispatchLocation,
                        dateStr,
                        totalCount,
                        activeCount,
                        dutyPattern,
                        customStartTime,
                        customEndTime,
                        customInterval,
                        leaders,
                        leaderMaxShifts,
                        team1,
                        team2,
                        team3,
                        team4,
                        teamActive,
                        excludedNames,
                        eventNotes,
                        personnelNotes,
                        locations,
                        schedule
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                    setJustSaved(true);
                    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                    saveTimerRef.current = setTimeout(() => setJustSaved(false), 1200);
                } catch (err) {
                    console.error("Auto-save failed:", err);
                }
            }, [
                unitTitle, dispatchLocation, dateStr, totalCount, activeCount,
                dutyPattern, customStartTime, customEndTime, customInterval,
                leaders, leaderMaxShifts,
                team1, team2, team3, team4, teamActive, excludedNames,
                eventNotes, personnelNotes,
                locations, schedule
            ]);

            // Reset all settings and schedule back to defaults
            const handleConfirmReset = () => {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                } catch (err) {
                    console.error("Failed to clear storage:", err);
                }
                const def = getDefaultState();
                setUnitTitle(def.unitTitle);
                setDispatchLocation(def.dispatchLocation);
                setDateStr(def.dateStr);
                setTotalCount(def.totalCount);
                setActiveCount(def.activeCount);
                setDutyPattern(def.dutyPattern);
                setCustomStartTime(def.customStartTime);
                setCustomEndTime(def.customEndTime);
                setCustomInterval(def.customInterval);
                setLeaders(def.leaders);
                setLeaderMaxShifts(def.leaderMaxShifts);
                setTeam1(def.team1);
                setTeam2(def.team2);
                setTeam3(def.team3);
                setTeam4(def.team4);
                setTeamActive(def.teamActive);
                setExcludedNames(def.excludedNames);
                setEventNotes(def.eventNotes);
                setPersonnelNotes(def.personnelNotes);
                setLocations(def.locations);
                setSchedule(def.schedule);
                setShowResetModal(false);
                showNotice("기본 예시 명단 및 설정으로 초기화되었습니다.", "success");
            };

            // Copy Unit Roster JSON to Clipboard
            const handleCopyRoster = () => {
                const sharePayload = {
                    unitTitle,
                    leaders,
                    leaderMaxShifts,
                    team1,
                    team2,
                    team3,
                    team4,
                    teamActive,
                    totalCount,
                    activeCount
                };
                const jsonString = JSON.stringify(sharePayload);
                const ok = copyTextToClipboard(jsonString);
                if (ok) {
                    showNotice("우리 제대 명단이 복사되었습니다! 단톡방에 붙여넣어 공유하세요.", "success");
                } else {
                    showNotice("복사에 실패했습니다. 브라우저 권한을 확인해주세요.", "error");
                }
            };

            // Validate and Import Unit Roster JSON
            const handleApplyImport = () => {
                const trimmed = importText.trim();
                if (!trimmed) {
                    showNotice("붙여넣을 명단 코드를 입력해주세요.", "error");
                    return;
                }
                try {
                    const parsed = JSON.parse(trimmed);
                    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
                        throw new Error("Invalid JSON object");
                    }
                    const expectedKeys = ["unitTitle", "leaders", "team1", "team2", "team3", "team4"];
                    const hasValidKey = expectedKeys.some(k => typeof parsed[k] === "string");
                    if (!hasValidKey) {
                        throw new Error("Missing roster fields");
                    }

                    if (typeof parsed.unitTitle === "string") setUnitTitle(parsed.unitTitle);
                    if (typeof parsed.leaders === "string") setLeaders(parsed.leaders);
                    if (typeof parsed.leaderMaxShifts === "number" && [0, 1, 2, 3].includes(parsed.leaderMaxShifts)) {
                        setLeaderMaxShifts(parsed.leaderMaxShifts);
                    }
                    if (typeof parsed.team1 === "string") setTeam1(parsed.team1);
                    if (typeof parsed.team2 === "string") setTeam2(parsed.team2);
                    if (typeof parsed.team3 === "string") setTeam3(parsed.team3);
                    if (typeof parsed.team4 === "string") setTeam4(parsed.team4);
                    if (Array.isArray(parsed.teamActive) && parsed.teamActive.length === 4) {
                        setTeamActive(parsed.teamActive.map(v => String(v)));
                    }
                    if (parsed.totalCount !== undefined) setTotalCount(String(parsed.totalCount));
                    if (parsed.activeCount !== undefined) setActiveCount(String(parsed.activeCount));

                    setExcludedNames([]);
                    setImportText("");
                    setShowImportModal(false);
                    showNotice("제대 명단을 성공적으로 불러와 자동 저장했습니다!", "success");
                } catch (err) {
                    console.error("Import error:", err);
                    showNotice("올바르지 않은 명단 코드입니다. 복사한 전체 텍스트를 그대로 붙여넣어 주세요.", "error");
                }
            };

            // Build schedule rows from a time list while preserving overlapping cell values
            const buildSchedulePreservingCells = (timesList) => {
                return timesList.map((t, idx) => {
                    const existingRow = schedule[idx];
                    const preservedCells = Array.from({ length: locations.length }, (_, cIdx) =>
                        existingRow && existingRow.cells[cIdx] !== undefined ? existingRow.cells[cIdx] : ""
                    );
                    return {
                        time: t,
                        timeColor: existingRow ? existingRow.timeColor : (idx === 0 ? "bg-yellow-100" : ""),
                        cells: preservedCells
                    };
                });
            };

            // Duty Pattern Switcher
            const handlePatternSelect = (patternKey) => {
                setDutyPattern(patternKey);
                if (patternKey === "기타") {
                    showNotice("기타 근무: 시작·종료 시간과 간격(30/60/90분)을 선택한 뒤 [시간표 적용]을 눌러주세요.", "info");
                    return;
                }
                const presetTimes = PATTERN_CONFIG[patternKey].times;
                setSchedule(buildSchedulePreservingCells(presetTimes));
                showNotice(`[${patternKey}] 시간표(${presetTimes.length}개 구간)가 적용되었습니다.`, "success");
            };

            // Manual schedule generation for [기타] pattern using selected interval (30/60/90 min)
            const handleGenerateManualSchedule = () => {
                const slots = generateTimeSlots(customStartTime, customEndTime, customInterval);
                if (slots === null) {
                    showNotice("시작 시간과 종료 시간을 올바르게 입력해주세요.", "error");
                    return;
                }
                if (slots.length === 0) {
                    showNotice("시작 시간과 종료 시간을 다르게 설정해주세요.", "error");
                    return;
                }
                setSchedule(buildSchedulePreservingCells(slots));
                showNotice(`[기타] ${customStartTime}~${customEndTime} (${customInterval}분 간격, ${slots.length}개 구간) 시간표가 적용되었습니다.`, "success");
            };

            // Toggle manual exclusion for an individual member
            const toggleExclude = (name) => {
                setExcludedNames(prev =>
                    prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]
                );
            };

            // Export hidden 1320px-wide capture template as high-resolution PNG
            const handleSaveImage = async () => {
                try {
                    const container = captureRef.current;
                    if (!container) return;
                    const canvas = await html2canvas(container, {
                        scale: 2.5,
                        backgroundColor: "#ffffff"
                    });
                    const link = document.createElement("a");
                    link.download = `기동대_근무표_${dateStr}_${dutyPattern}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    showNotice("근무표 이미지가 저장되었습니다.", "success");
                } catch (err) {
                    console.error("Image export error:", err);
                    showNotice("이미지 저장 중 오류가 발생했습니다. 다시 시도해주세요.", "error");
                }
            };

            // Location column handlers
            const addLocation = () => {
                setLocations([...locations, { text: "새 근무지", color: "" }]);
                setSchedule(schedule.map(row => ({ ...row, cells: [...row.cells, ""] })));
            };

            const removeLocation = (index) => {
                if (locations.length <= 1) {
                    showNotice("최소 1개의 근무지는 유지해야 합니다.", "error");
                    return;
                }
                setLocations(locations.filter((_, i) => i !== index));
                setSchedule(schedule.map(row => ({ ...row, cells: row.cells.filter((_, i) => i !== index) })));
            };

            const updateLocation = (index, value) => {
                const newLocs = [...locations];
                newLocs[index] = { ...newLocs[index], text: value };
                setLocations(newLocs);
            };

            const toggleLocationColor = (index) => {
                const newLocs = [...locations];
                const curr = newLocs[index].color;
                const nextColor = curr === "" ? "bg-yellow-200" : curr === "bg-yellow-200" ? "bg-green-300" : "";
                newLocs[index] = { ...newLocs[index], color: nextColor };
                setLocations(newLocs);
            };

            // Schedule row handlers
            const updateTime = (index, value) => {
                const newSchedule = [...schedule];
                newSchedule[index] = { ...newSchedule[index], time: value };
                setSchedule(newSchedule);
            };

            const toggleTimeColor = (index) => {
                const newSched = [...schedule];
                const curr = newSched[index].timeColor;
                const nextColor = curr === "" ? "bg-yellow-200" : curr === "bg-yellow-200" ? "bg-green-300" : "";
                newSched[index] = { ...newSched[index], timeColor: nextColor };
                setSchedule(newSched);
            };

            const updateCell = (rIndex, cIndex, value) => {
                const newSchedule = [...schedule];
                const updatedCells = [...newSchedule[rIndex].cells];
                updatedCells[cIndex] = value;
                newSchedule[rIndex] = { ...newSchedule[rIndex], cells: updatedCells };
                setSchedule(newSchedule);
            };

            const addRow = () => {
                setSchedule([
                    ...schedule,
                    { time: "00:00", timeColor: "", cells: Array(locations.length).fill("") }
                ]);
            };

            const removeRow = (index) => {
                if (schedule.length <= 1) {
                    showNotice("최소 1개의 시간대는 유지해야 합니다.", "error");
                    return;
                }
                setSchedule(schedule.filter((_, i) => i !== index));
            };

            const updateTeamActive = (index, value) => {
                const newActive = [...teamActive];
                newActive[index] = value;
                setTeamActive(newActive);
            };

            // Real-time work shift counts across all schedule cells
            const workCounts = useMemo(() => {
                const counts = {};
                schedule.forEach(row => {
                    row.cells.forEach(cell => {
                        const name = cell.trim();
                        if (name && name !== "-") {
                            counts[name] = (counts[name] || 0) + 1;
                        }
                    });
                });
                return counts;
            }, [schedule]);

            const leaderArray = useMemo(
                () => leaders.split(",").map(s => s.trim()).filter(Boolean),
                [leaders]
            );

            // Parse team rosters supporting "[계급 이름]" and "[계급 이름]:표시값" (e.g., 경사 김성현:항해사)
            const parseTeamMembers = (teamStr) => {
                return teamStr
                    .split("\n")
                    .map(line => {
                        const trimmed = line.trim();
                        if (!trimmed) return null;
                        let name = trimmed;
                        let customDisplay = null;
                        if (trimmed.includes(":")) {
                            const parts = trimmed.split(":");
                            name = parts[0].trim();
                            customDisplay = parts.slice(1).join(":").trim();
                        }
                        const isLeader = leaderArray.includes(name);
                        const isManuallyExcluded = excludedNames.includes(name);
                        const hasCustomDisplay = customDisplay !== null;
                        const isRotationExcluded = isManuallyExcluded || hasCustomDisplay || (isLeader && leaderMaxShifts === 0);
                        const shiftCount = workCounts[name] || 0;
                        return {
                            name,
                            shiftCount,
                            display: hasCustomDisplay ? customDisplay : shiftCount,
                            customDisplay,
                            hasCustomDisplay,
                            isManuallyExcluded,
                            isRotationExcluded,
                            isLeader
                        };
                    })
                    .filter(Boolean);
            };

            const t1 = parseTeamMembers(team1);
            const t2 = parseTeamMembers(team2);
            const t3 = parseTeamMembers(team3);
            const t4 = parseTeamMembers(team4);
            const allTeams = [
                { label: "1팀", members: t1 },
                { label: "2팀", members: t2 },
                { label: "3팀", members: t3 },
                { label: "4팀", members: t4 }
            ];
            const maxRows = Math.max(t1.length, t2.length, t3.length, t4.length) || 1;

            // Active members for datalist autocomplete (excludes only manually excluded members)
            const datalistMembers = [...t1, ...t2, ...t3, ...t4]
                .filter(m => m && !m.isManuallyExcluded)
                .map(m => m.name);

            // Rotation pool for auto-fill (excludes manually excluded, special fixed roles, and leaders if 0)
            const rotationPool = [...t1, ...t2, ...t3, ...t4]
                .filter(m => m && !m.isRotationExcluded)
                .map(m => m.name);

            // Real-time Summary & Unmatched Name Detection for Section 5
            const liveStats = useMemo(() => {
                const allRosterMembers = [...t1, ...t2, ...t3, ...t4];
                const rosterNameSet = new Set(allRosterMembers.map(m => m.name));

                // Total assigned non-empty, non-'-' cells
                let totalAssignedSlots = 0;
                const unmatchedMap = {};
                schedule.forEach(row => {
                    row.cells.forEach(cell => {
                        const name = cell.trim();
                        if (name && name !== "-") {
                            totalAssignedSlots += 1;
                            if (!rosterNameSet.has(name)) {
                                unmatchedMap[name] = (unmatchedMap[name] || 0) + 1;
                            }
                        }
                    });
                });

                // Active non-special-role members (for active count & min~max range)
                const activeRegularMembers = allRosterMembers.filter(
                    m => !m.isManuallyExcluded && !m.hasCustomDisplay
                );
                const countsArr = activeRegularMembers.map(m => m.shiftCount);
                const minShifts = countsArr.length > 0 ? Math.min(...countsArr) : 0;
                const maxShifts = countsArr.length > 0 ? Math.max(...countsArr) : 0;

                const unmatchedList = Object.entries(unmatchedMap).map(([name, count]) => ({
                    name,
                    count
                }));

                return {
                    totalAssignedSlots,
                    activeRegularCount: activeRegularMembers.length,
                    minShifts,
                    maxShifts,
                    unmatchedList
                };
            }, [schedule, t1, t2, t3, t4]);

            // Automatic full-schedule rotation starting from schedule[0].cells[0]
            const globalAutoFill = () => {
                try {
                    if (!schedule.length || !schedule[0].cells.length) {
                        showNotice("시간표 칸이 비어 있습니다.", "error");
                        return;
                    }

                    const firstWorker = schedule[0].cells[0].trim();
                    if (!firstWorker || firstWorker === "-") {
                        showNotice("첫 번째 칸에 시작할 대원 이름을 입력해주세요.", "error");
                        return;
                    }

                    const leaderSet = new Set(leaderArray);

                    if (leaderSet.has(firstWorker) && leaderMaxShifts === 0) {
                        showNotice(
                            "지휘부가 '순환 제외' 상태입니다. 첫 근무자를 변경하거나 순환포함 횟수(1~3회)를 선택해주세요.",
                            "error"
                        );
                        return;
                    }

                    if (rotationPool.length === 0) {
                        showNotice("배치할 수 있는 근무자가 명단에 없습니다.", "error");
                        return;
                    }

                    let currentIndex = rotationPool.indexOf(firstWorker);
                    if (currentIndex === -1) {
                        showNotice(`'${firstWorker}' 대원을 실근무 명단에서 찾을 수 없습니다.`, "error");
                        return;
                    }

                    const currentCounts = {};
                    currentCounts[firstWorker] = 1;

                    const newSchedule = schedule.map((row, rIndex) => {
                        const newCells = [...row.cells];
                        for (let cIndex = 0; cIndex < newCells.length; cIndex++) {
                            if (rIndex === 0 && cIndex === 0) continue;
                            if (newCells[cIndex] === "-") continue;

                            let assigned = false;
                            let attempts = 0;
                            while (attempts < rotationPool.length) {
                                currentIndex = (currentIndex + 1) % rotationPool.length;
                                const candidate = rotationPool[currentIndex];
                                const candCount = currentCounts[candidate] || 0;

                                // Cap leader shifts according to leaderMaxShifts (1, 2, or 3)
                                if (leaderSet.has(candidate) && candCount >= leaderMaxShifts) {
                                    attempts++;
                                    continue;
                                }
                                newCells[cIndex] = candidate;
                                currentCounts[candidate] = candCount + 1;
                                assigned = true;
                                break;
                            }

                            if (!assigned) {
                                currentIndex = (currentIndex + 1) % rotationPool.length;
                                newCells[cIndex] = rotationPool[currentIndex];
                            }
                        }
                        return { ...row, cells: newCells };
                    });

                    setSchedule(newSchedule);
                    const leaderMsg = leaderMaxShifts === 0 ? "지휘부 순환 제외" : `지휘부 최대 ${leaderMaxShifts}회`;
                    showNotice(`전체 자동 순환배치 완료 (${leaderMsg})`, "success");
                } catch (err) {
                    console.error("Auto-fill error:", err);
                    showNotice("자동 배치 중 오류가 발생했습니다.", "error");
                }
            };

            // Split special notes into non-empty lines for ✔ checkmark rendering
            const eventLines = eventNotes
                .split("\n")
                .map(line => line.trim())
                .filter(Boolean);

            const personnelLines = personnelNotes
                .split("\n")
                .map(line => line.trim())
                .filter(Boolean);

            return (
                <div className="relative">
                    {/* Toast Notification Banner */}
                    {notice && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md pointer-events-none">
                            <div
                                className={`px-4 py-3 rounded-xl shadow-lg text-sm font-bold text-center border ${
                                    notice.type === "error"
                                        ? "bg-red-600 text-white border-red-700"
                                        : notice.type === "success"
                                        ? "bg-blue-900 text-white border-blue-950"
                                        : "bg-gray-800 text-white border-gray-900"
                                }`}
                            >
                                {notice.message}
                            </div>
                        </div>
                    )}

                    {/* Reset Confirmation Modal */}
                    {showResetModal && (

                            <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 flex flex-col gap-4">
                                <h3 className="text-lg font-extrabold text-gray-900">
                                    🔄 설정 및 명단 초기화
                                </h3>
                                <p className="text-sm text-gray-600 leading-relaxed">
                                    현재 스마트폰에 저장된 우리 제대 명단과 근무표를 모두 지우고, 기본 예시 명단으로 되돌리시겠습니까?
                                </p>
                                <div className="flex gap-2.5 mt-1">
                                    <button
                                        type="button"
                                        onClick={() => setShowResetModal(false)}
                                        className="flex-1 py-2.5 rounded-xl border border-gray-300 font-bold text-gray-700 bg-gray-50 hover:bg-gray-100 transition"
                                    >
                                        취소
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleConfirmReset}
                                        className="flex-1 py-2.5 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 transition"
                                    >
                                        초기화 실행
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Roster Import Modal */}
                    {showImportModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 flex flex-col gap-4">
                                <div className="flex items-center justify-between border-b border-gray-100 pb-2">
                                    <h3 className="text-lg font-extrabold text-blue-900">
                                        📥 우리 제대 명단 불러오기
                                    </h3>
                                    <button
                                        type="button"
                                        onClick={() => setShowImportModal(false)}
                                        className="text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none px-1"
                                    >
                                        ×
                                    </button>
                                </div>
                                <p className="text-xs text-gray-600 leading-relaxed">
                                    동료가 단톡방에 공유한 <strong>명단 코드(JSON)</strong>를 아래 칸에 붙여넣고 <strong>[적용하기]</strong>를 누르면 내 스마트폰에 즉시 저장됩니다.
                                </p>
                                <textarea
                                    className="w-full border-2 border-blue-200 focus:border-blue-500 rounded-xl p-3 text-xs font-mono outline-none resize-none bg-gray-50"
                                    rows="6"
                                    placeholder='{"unitTitle":"00기 0제대 근무일지", ...}'
                                    value={importText}
                                    onChange={e => setImportText(e.target.value)}
                                ></textarea>
                                <div className="flex gap-2.5">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setImportText("");
                                            setShowImportModal(false);
                                        }}
                                        className="flex-1 py-3 rounded-xl border border-gray-300 font-bold text-gray-700 bg-gray-50 hover:bg-gray-100 transition"
                                    >
                                        취소
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleApplyImport}
                                        className="flex-1 py-3 rounded-xl font-extrabold text-white bg-blue-700 hover:bg-blue-800 shadow-sm transition"
                                    >
                                        적용하기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Autocomplete datalist for schedule inputs */}
                    <datalist id="active-members">
                        {datalistMembers.map((name, idx) => (
                            <option key={`dl-${idx}`} value={name} />
                        ))}
                        <option value="-" />
                    </datalist>

                    {/* Mobile-first Responsive Editor */}
                    <div className="min-h-screen p-4 flex flex-col gap-5 max-w-3xl mx-auto pb-28">
                        {/* Top Header & Auto-Save Bar */}
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 px-4 py-3.5 flex flex-wrap items-center justify-between gap-2">
                            <div className="flex items-center gap-2.5">
                                <h2 className="text-xl sm:text-2xl font-black text-gray-800 tracking-tight">
                                    📱 근무표 에디터
                                </h2>
                                <span
                                    className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-extrabold border transition ${
                                        justSaved
                                            ? "bg-emerald-100 text-emerald-800 border-emerald-300"
                                            : "bg-emerald-50 text-emerald-700 border-emerald-200"
                                    }`}
                                >
                                    💾 자동 저장됨
                                </span>
                            </div>
                            <button
                                type="button"
                                onClick={() => setShowResetModal(true)}
                                className="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-700 text-xs font-extrabold border border-gray-200 transition"
                            >
                                🔄 초기화
                            </button>
                        </div>

                        {/* Section 1: 1. 상단 타이틀 설정 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col gap-4">
                            <h3 className="font-bold text-lg border-b border-gray-100 pb-2 text-blue-700">
                                1. 상단 타이틀 설정
                            </h3>
                            <div>
                                <label className="block text-sm font-semibold text-gray-600 mb-1">
                                    기수·제대명 (예: 00기 0제대 근무일지)
                                </label>
                                <input
                                    className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500"
                                    value={unitTitle}
                                    onChange={e => setUnitTitle(e.target.value)}
                                />
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-sm font-semibold text-gray-600 mb-1">
                                        출동장소
                                    </label>
                                    <input
                                        className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500"
                                        value={dispatchLocation}
                                        onChange={e => setDispatchLocation(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-gray-600 mb-1">
                                        날짜
                                    </label>
                                    <input
                                        className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500"

                                        onChange={e => setDateStr(e.target.value)}
                                    />
                                </div>
                            </div>
                            <div className="flex gap-3">
                                <div className="w-1/2">
                                    <label className="block text-sm font-semibold text-gray-600 mb-1">
                                        총원
                                    </label>
                                    <input
                                        className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500"
                                        value={totalCount}
                                        onChange={e => setTotalCount(e.target.value)}
                                    />
                                </div>
                                <div className="w-1/2">
                                    <label className="block text-sm font-semibold text-gray-600 mb-1">

                                    </label>
                                    <input
                                        className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:border-blue-500"
                                        value={activeCount}
                                        onChange={e => setActiveCount(e.target.value)}
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Leader Management Box: 👑 지휘부 (제대장/수인) 특별 관리 */}
                        <div className="bg-yellow-50/80 rounded-2xl shadow-sm border-2 border-yellow-300 p-5 flex flex-col gap-3">
                            <h3 className="font-extrabold text-lg text-yellow-900 border-b-2 border-yellow-300 pb-2">
                                👑 지휘부 (제대장/수인) 특별 관리
                            </h3>
                            <input
                                className="w-full border-2 border-yellow-400 rounded-lg p-2.5 text-sm font-extrabold outline-none bg-white"
                                value={leaders}
                                onChange={e => setLeaders(e.target.value)}
                                placeholder="경감 홍길동, 경위 김철수 (쉼표로 구분)"
                            />
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                {LEADER_SHIFT_OPTIONS.map(opt => {

                                    return (
                                        <button

                            </div>
                        </div>

                        {/* Section 2: 2. 부대 명단 및 팀별 실근무 인원 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col gap-4">
                            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 border-b border-gray-100 pb-3">
                                <h3 className="font-bold text-lg text-blue-700">

                                <div className="flex gap-2">
                                    <button

                                    >

                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setShowImportModal(true)}
                                        className="flex-1 sm:flex-none px-3 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-800 text-xs font-extrabold border border-indigo-200 transition"
                                    >
                                        📥 명단 불러오기
                                    </button>
                                </div>
                            </div>

                            <p className="text-xs text-gray-500 -mt-2">
                                • 한 줄에 <strong>[계급 이름]</strong> 형식으로 입력 (고정 보직은 <code>경사 김성현:항해사</code>처럼 입력) • 아래 이름 버튼 터치 시 금일 열외 처리
                            </p>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {[
                                    { t: team1, setT: setTeam1, parsed: t1, act: teamActive[0] },
                                    { t: team2, setT: setTeam2, parsed: t2, act: teamActive[1] },

                                ].map((item, idx) => (

                        {/* Section 3: 3. 금일 상황 및 특이사항 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 flex flex-col gap-4">

                                            <tr className="border-t-2 border-gray-900 font-extrabold text-base bg-gray-50">
                                                <td colSpan="2" className="border-r border-gray-900 py-2">{teamActive[0]}</td>
                                                <td colSpan="2" className="border-r border-gray-900 py-2">{teamActive[1]}</td>
                                                <td colSpan="2" className="border-r border-gray-900 py-2">{teamActive[2]}</td>
                                                <td colSpan="2" className="py-2">{teamActive[3]}</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    {/* Emphasized Special Notes Box with Per-Line ✔ Checkmarks */}
                                    <div className="border-4 border-[#1e3a8a] bg-[#eff6ff] p-6 rounded-2xl flex flex-col h-full shadow-md">
                                        <h3 className="text-2xl font-black text-[#1e3a8a] border-b-4 border-[#1e3a8a] pb-3 mb-4 flex items-center gap-2">
                                            📌 금일 상황 및 특이사항
                                        </h3>

                                        {eventLines.length > 0 && (
                                            <div className="mb-4">
                                                <div className="font-extrabold text-[19px] text-blue-950 mb-2">
                                                    [집회상황]
                                                </div>
                                                <div className="space-y-2.5 text-[18px] font-bold leading-relaxed text-gray-900">
                                                    {eventLines.map((line, idx) => (
                                                        <div key={`ev-${idx}`} className="flex items-start gap-2.5">
                                                            <span className="text-[#1e3a8a] font-black shrink-0">✔</span>
                                                            <span>{line}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {personnelLines.length > 0 && (
                                            <div className="mt-auto pt-3 border-t-2 border-blue-300">
                                                <div className="space-y-2.5 text-[18px] font-bold leading-relaxed text-gray-900">
                                                    {personnelLines.map((line, idx) => (
                                                        <div key={`pn-${idx}`} className="flex items-start gap-2.5">
                                                            <span className="text-[#1e3a8a] font-black shrink-0">✔</span>
                                                            <span>{line}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
